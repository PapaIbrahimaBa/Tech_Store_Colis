<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de commande - Tech Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-tech">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-cpu"></i> Tech Store</a>
            <ul class="navbar-nav mx-auto d-flex flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link active" href="suivi.html">Suivre ma commande</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 640px;">
        <div class="tracking-hero mb-4">
            <h3 class="text-white mb-3"><i class="bi bi-truck"></i> Où est mon colis ?</h3>
            <div class="input-group">
                <input type="text" id="numeroRecherche" class="form-control" placeholder="Ex : COL-2026-4821">
                <button class="btn btn-gold" onclick="rechercherColis()">Suivre</button>
            </div>
            <div id="messageErreur" class="text-warning mt-2 small" style="display:none;">
                Aucun colis trouvé pour ce numéro.
            </div>
        </div>

        <div id="resultatColis" class="card p-4" style="display:none;">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h5 class="mb-1" id="colisNumero"></h5>
                    <span class="text-muted" id="colisClient"></span>
                </div>
                <span class="badge fs-6" id="colisStatutBadge"></span>
            </div>
            <div id="colisDescription" class="text-muted mb-3"></div>
            <hr>
            <h6>Historique</h6>
            <div class="timeline mt-3" id="colisHistorique"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/suiviScript.js"></script>
</body>

</html>
